          fi
      - if: steps.build.outputs.chained == '1'
        uses: actions/upload-artifact@v4
        with: { name: "ckpt-${{ inputs.label }}-ref-${{ matrix.skin }}-2", path: ckpt/case.tar, retention-days: 2 }
      - if: steps.go.outputs.go == '1' && steps.build.outputs.chained != '1' && 'ref' == 'car'
