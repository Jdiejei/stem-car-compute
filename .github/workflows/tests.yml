name: tests

# All five parts' tests and whole cars, split across parallel machines.
on:
  push:
  workflow_dispatch:
    inputs:
      cars:
        description: Also build the whole test cars (includes the multi-hour CFD ones)
        default: "true"

concurrency:
  group: tests-${{ github.ref }}-${{ inputs.cars == 'true' && github.run_id || 'quick' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PY_DEPS: pytest numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Part 1 is the slow suite, so it is shared between four machines.
        include:
          - { part: part1-simulation, shard: 0, of: 4 }
          - { part: part1-simulation, shard: 1, of: 4 }
          - { part: part1-simulation, shard: 2, of: 4 }
          - { part: part1-simulation, shard: 3, of: 4 }
          - { part: part2-simulation, shard: 0, of: 1 }
          - { part: part3-simulation, shard: 0, of: 1 }
          - { part: part4-simulation, shard: 0, of: 1 }
          - { part: part5-simulation, shard: 0, of: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Libraries the remesher needs
        run: (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done) && sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
      - run: pip install $PY_DEPS
      - name: The remesh filter loads
        run: python -c "import pymeshlab as m; s=m.MeshSet(); s.create_cube(); s.apply_filter('meshing_isotropic_explicit_remeshing', iterations=1); print('remesher ok')"
      - name: pytest
        working-directory: ${{ matrix.part }}
        env:
          PART2_PATH: ${{ github.workspace }}/part2-simulation
        run: |
          files=$(ls tests/test_*.py | awk -v s=${{ matrix.shard }} -v n=${{ matrix.of }} 'NR % n == s')
          python -m pytest $files -q -p no:cacheprovider --tb=short -W ignore

  car:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cars == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: start, args: "--body-json '{}'" }
          - { id: round2, args: "--body-json \"$(cat checks/round2_car.json)\"" }
          - { id: parts, args: "--body-json \"$(cat checks/round2_car.json)\" --fwing-json '{\"aoa_deg\": 8.0}' --support-json '{\"disc_front\": true}' --nose-json '{\"length_mm\": 25.0, \"wall_mm\": 99.0}'" }
          - { id: start_cfd, cfd: true, args: "--body-json '{}' --cfd --res medium --np 4 --keep-runs" }
          # The same car with legal ballast, so the body can be smaller: which is faster?
          - { id: ballast6_cfd, cfd: true, args: "--body-json '{}' --cfd --res medium --np 4 --keep-runs --ballast-g 6" }
          # Finer grids. Sized at 0.5 mm; a single fixed skin at the 0.3 mm production grid.
          - { id: fine05, args: "--body-json '{}' --cfd-mm 0.5" }
          - { id: fine03, allow_mass: true, args: "--body-json '{}' --cfd-mm 0.3 --skin-mm 3.5" }
          # The same car again on a wall-resolved mesh: does the score hold?
          # One level finer than the search's mesh: the mesh study most likely to finish in time.
    env:
      OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Libraries the remesher needs
        run: (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done) && sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
      - run: pip install $PY_DEPS
      - name: The remesh filter loads
        run: python -c "import pymeshlab as m; s=m.MeshSet(); s.create_cube(); s.apply_filter('meshing_isotropic_explicit_remeshing', iterations=1); print('remesher ok')"
      - name: Install ESI OpenFOAM v2412
        if: ${{ matrix.cfd }}
        run: |
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y openfoam2412-default
      - name: Build the car
        working-directory: part5-simulation
        run: |
          set -o pipefail
          mkdir -p ../out
          python run_car.py --out ../out/${{ matrix.id }} ${{ matrix.args }} 2>&1 | tee ../out/${{ matrix.id }}.log
      - name: Solver logs
        if: always()
        run: |
          mkdir -p out/${{ matrix.id }}/solver_logs
          find part2-simulation/cfd_case_template -path "*/logs/*.log" 2>/dev/null | while read f; do
            tail -200 "$f" > "out/${{ matrix.id }}/solver_logs/$(basename "$f")"
          done
          rm -rf part2-simulation/cfd_case_template/*runs* 2>/dev/null || true
      - name: Rule checks
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("out/${{ matrix.id }}/summary.json")
          if not p.exists():
              print("No summary: the build did not finish.")
              raise SystemExit
          S = json.loads(p.read_text())
          L = S["legality"]
          print(f"## ${{ matrix.id }}\n\n{L['summary']['n_checks']} checks, {L['summary']['n_failed']} failed. "
                f"Mass as manufactured {S['mass'].get('manufactured_mass_g', 0):.2f} g.\n")
          print("| rule | margin | pass | note |\n|---|---|---|---|")
          for k, v in sorted(L["checks"].items(), key=lambda kv: (kv[1]["pass"], kv[0])):
              print(f"| {k} | {v['margin']:+.3f} | {'yes' if v['pass'] else '**NO**'} | {v['note']} |")
          EOF
      - name: Fail if any rule check failed
        run: |
          python - <<'EOF'
          import json, sys
          failed = json.load(open("out/${{ matrix.id }}/summary.json"))["legality"]["summary"]["failed"]
          if "${{ matrix.allow_mass }}" == "true":          # a fixed skin is not sized for T3.6
              failed = [f for f in failed if f != "T3.6_mass"]
          print("failed:", failed)
          sys.exit(bool(failed))
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: car-${{ matrix.id }}
          path: |
            out/*.log
            out/${{ matrix.id }}/*.md
            out/${{ matrix.id }}/*.json
            out/${{ matrix.id }}/manufacture/*.stl
            out/${{ matrix.id }}/solver_logs/

  long_fine_1:
    # The CFD-heavy car start_fine, link 1 of 3 (CHECKPOINTS in part2 openfoam_case):
    # each link solves until 30 min before the 6 h job limit, saves the case and
    # hands it to the next link, which continues from the latest time.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cars == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      chained: ${{ steps.build.outputs.chained }}
    env:
      OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - run: echo "P2_JOB_DEADLINE=$(( $(date +%s) + 340*60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Libraries the remesher needs
        run: (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done) && sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
      - run: pip install $PY_DEPS
      - name: Install ESI OpenFOAM v2412
        run: |
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y openfoam2412-default
      - name: Saved case from the previous link
        if: 1 != 1
        uses: actions/download-artifact@v4
        with: { name: "ckpt-start_fine-0", path: /tmp/ckpt }
      - name: Build the car
        id: build
        working-directory: part5-simulation
        run: |
          mkdir -p ../out
          export P2_CHECKPOINT_FILE=$PWD/../ckpt_path.txt
          if [ -f /tmp/ckpt/case.tar ]; then
            mkdir -p /tmp/case && tar -xf /tmp/ckpt/case.tar -C /tmp/case && rm -f /tmp/ckpt/case.tar && export P2_RESUME_CASE=/tmp/case/run
            echo "continuing the saved case"
          fi
          set +e
          python run_car.py --out ../out/start_fine --body-json '{}' --cfd --res fine --np 4 --keep-runs 2>&1 | tee ../out/start_fine.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ -f ../ckpt_path.txt ]; then
            r=$(cat ../ckpt_path.txt)
            mkdir -p ../ckpt && tar -cf ../ckpt/case.tar -C "$(dirname "$r")" --transform "s|^$(basename "$r")|run|" "$(basename "$r")"
            du -sh ../ckpt/case.tar
            echo "chained=true" >> "$GITHUB_OUTPUT"
            if [ 1 = 3 ]; then echo "still not finished after 3 links"; exit 1; fi
            exit 0
          fi
          exit $rc
      - if: steps.build.outputs.chained == 'true'
        uses: actions/upload-artifact@v4
        with: { name: "ckpt-start_fine-1", path: ckpt/case.tar, retention-days: 2 }
      - name: Solver logs
        if: always() && steps.build.outputs.chained != 'true'
        run: |
          mkdir -p out/start_fine/solver_logs
          find part2-simulation/cfd_case_template /tmp/case -path "*/logs/*.log" 2>/dev/null | while read f; do
            tail -200 "$f" > "out/start_fine/solver_logs/$(basename "$f")"
          done
      - name: Rule checks
        if: always() && steps.build.outputs.chained != 'true'
        run: |
          python - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("out/start_fine/summary.json")
          if not p.exists():
              print("No summary: the build did not finish.")
              raise SystemExit
          S = json.loads(p.read_text())
          L = S["legality"]
          print(f"## start_fine\n\n{L['summary']['n_checks']} checks, {L['summary']['n_failed']} failed. "
                f"Mass as manufactured {S['mass'].get('manufactured_mass_g', 0):.2f} g.\n")
          print("| rule | margin | pass | note |\n|---|---|---|---|")
          for k, v in sorted(L["checks"].items(), key=lambda kv: (kv[1]["pass"], kv[0])):
              print(f"| {k} | {v['margin']:+.3f} | {'yes' if v['pass'] else '**NO**'} | {v['note']} |")
          PYEOF
      - name: Fail if any rule check failed
        if: steps.build.outputs.chained != 'true'
        run: |
          python - <<'PYEOF'
          import json, sys
          failed = json.load(open("out/start_fine/summary.json"))["legality"]["summary"]["failed"]
          print("failed:", failed)
          sys.exit(bool(failed))
          PYEOF
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outputs.chained != 'true'
        with:
          name: car-start_fine
          path: |
            out/*.log
            out/start_fine/*.md
            out/start_fine/*.json
            out/start_fine/manufacture/*.stl
            out/start_fine/solver_logs/

