name: noise_long

# Is the drag noise the solve stopping too soon, or the mesh? The same car at skins 0.01 mm
# apart, run to 5000 iterations, with drag read at several stopping points and windows.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1

jobs:
  car:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        skin: ["3.90", "3.91", "3.92", "3.93", "3.94", "3.95", "3.96", "3.97"]
    env:
      OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 25
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done)
          sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -q openfoam2412-default
      - run: pip install $PY_DEPS
      - working-directory: part5-simulation
        run: python -W ignore run_car.py --out ../out/s${{ matrix.skin }} --body-json '{}' --skin-mm ${{ matrix.skin }} --cfd --cfd-iters 5000 --res medium --np 4 --keep-runs 2>&1 | tail -2
      - name: The numbers
        if: always()
        run: |
          python - <<'EOF'
          import glob, json, re
          import numpy as np
          c = json.load(open("out/s${{ matrix.skin }}/summary.json"))["cfd_initial"]
          print("LONG", ${{ matrix.skin }}, "summary", c["D20_N"], c["T_at_target_s"], c["converged"])
          total = None
          for f in glob.glob("part2-simulation/cfd_case_template/runs/*/postProcessing/forces*/*/force*.dat"):
              rows = []
              for line in open(f):
                  if not line.startswith("#"):
                      rows.append([float(v) for v in re.sub(r"[()]", " ", line).split()[:2]])
              a = np.array(rows)
              if len(a) < 100:
                  continue
              total = a[:, 1] if total is None else total + a[:, 1] if len(a) == len(total) else total
              print("LONG file", f.split("postProcessing/")[1], len(a), round(float(a[-1000:, 1].mean()), 5))
          for end in (2000, 3000, 4000, 5000):
              print("LONG", ${{ matrix.skin }}, "end", end, " ".join(f"w{w} {total[end - int(end * w):end].mean():.5f}" for w in (0.1, 0.2, 0.4, 0.6)))
          EOF
