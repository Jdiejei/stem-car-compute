name: solver

# Runs part5-simulation/solver.py on its own: one stage per run, each run starting the
# next, until every chain has stopped. Start it by hand with the number of chains.
on:
  workflow_dispatch:
    inputs:
      chains:
        description: "starting cars; only used when there is no solver state yet"
        default: "8"

permissions:
  contents: write
  actions: write

concurrency:
  group: solver
  cancel-in-progress: false

env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.jobs.outputs.kind }}
      ids: ${{ steps.jobs.outputs.ids }}
      sha: ${{ steps.jobs.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install $PY_DEPS
      - name: Start the state if there is none
        working-directory: part5-simulation
        run: |
          if [ ! -f search/solver_state.json ]; then
            python -W ignore solver.py init --chains ${{ inputs.chains || '8' }}
            git config user.name "solver"
            git config user.email "solver@users.noreply.github.com"
            git add -f search/solver_state.json search/solver_batch.json
            git commit -m "Solver: start ${{ inputs.chains || '8' }} chains [skip ci]"
            git push
          fi
      - id: jobs
        working-directory: part5-simulation
        run: |
          python -W ignore solver.py jobs > /tmp/jobs.json
          cat /tmp/jobs.json
          echo "kind=$(python -c "import json;print(json.load(open('/tmp/jobs.json'))['kind'])")" >> "$GITHUB_OUTPUT"
          echo "ids=$(python -c "import json;print(json.dumps(json.load(open('/tmp/jobs.json'))['ids']))")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  work:
    needs: plan
    if: ${{ needs.plan.outputs.kind != 'done' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    env:
      OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}   # the commit with the batch; one code for a whole stage
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Libraries
        timeout-minutes: 20
        run: |
          (for i in 1 2 3 4; do timeout 240 sudo apt-get update -q && break; done)
          sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -q openfoam2412-default
      - run: pip install $PY_DEPS
      - name: Run it
        working-directory: part5-simulation
        run: |
          if [ "${{ needs.plan.outputs.kind }}" = "adjoint" ]; then
            python -W ignore solver.py adjoint --chain ${{ matrix.id }} --out ../out
          else
            python -W ignore solver.py eval --id ${{ matrix.id }} --out ../out
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.id }}
          path: |
            out/car_*.json
            out/slopes_*.json
          retention-days: 14
          if-no-files-found: ignore

  advance:
    needs: [plan, work]
    if: ${{ !cancelled() && needs.plan.outputs.kind != 'done' && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install $PY_DEPS
      - uses: actions/download-artifact@v4
        with: { path: results }
      - name: Read the results and plan the next stage
        working-directory: part5-simulation
        run: |
          python -W ignore solver.py advance ../results | tee /tmp/advance.txt
          python -W ignore solver.py report | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "solver"
          git config user.email "solver@users.noreply.github.com"
          git add -f search/solver_state.json search/solver_batch.json
          git commit -m "Solver: $(head -c 120 /tmp/advance.txt | tr '\n' ' ') [skip ci]" || true
          git pull --rebase -q
          git push
      - name: Next stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run solver.yml --ref main
