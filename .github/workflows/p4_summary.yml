name: p4_summary
run-name: "Part 4: summary of car batch ${{ inputs.run_id }}"

# Summarise a finished p4_assembly / stress run in this repo: car counts by status, the rules
# broken, the crashes. Downloads only that run's car files.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: the batch run's id
        required: true

permissions:
  contents: read
  actions: read

jobs:
  summary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: "stress-*"
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: pip install numpy==2.4.6 scipy==1.17.1 trimesh==5.2.0 shapely
      - name: Summary
        working-directory: part5-simulation
        run: |
          python checks/stress_cars.py --summary ../all 2>&1 | tee ../summary.txt | tee -a "$GITHUB_STEP_SUMMARY"
          python - <<'PY' | tee -a ../summary.txt
          import json, pathlib, collections
          rows = [json.loads(p.read_text()) for p in pathlib.Path("../all").rglob("car_*.json")]
          seeds = sorted({p.name.split("_")[1] for p in pathlib.Path("../all").rglob("car_*.json")})
          print(f"\nseeds with results: {len(seeds)}")
          bad = collections.Counter()
          for r in rows:
              for k in r.get("failed", []):
                  bad[k] += 1
          ill = [r for r in rows if r["status"] == "illegal"]
          print("illegal cars, first 15 with their notes:")
          for r in ill[:15]:
              print(" ", r.get("failed"), {k: str(v)[:160] for k, v in (r.get("notes") or {}).items() if k in r.get("failed", [])})
          PY
      - uses: actions/upload-artifact@v4
        with: { name: summary, path: summary.txt }
