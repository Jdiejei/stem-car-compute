name: noise

# How much does drag jump for a tiny shape change? The same car at skins 0.01 mm apart.
# Real drag moves almost in a straight line over so small a range: what is left over is
# the noise the solver has to beat. A repeat of one car can't show it: it gets the same mesh.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1

jobs:
  car:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        skin: ["3.90", "3.91", "3.92", "3.93", "3.94", "3.95", "3.96", "3.97"]
    env:
      OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 20
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -q openfoam2412-default
      - run: pip install $PY_DEPS
      - working-directory: part5-simulation
        run: python -W ignore run_car.py --out ../out/s${{ matrix.skin }} --body-json '{}' --skin-mm ${{ matrix.skin }} --cfd --res medium --np 4 2>&1 | tail -3
      - name: The numbers
        if: always()
        run: |
          python - <<'EOF'
          import json
          c = json.load(open("out/s${{ matrix.skin }}/summary.json"))["cfd_initial"]
          print("NOISE", ${{ matrix.skin }}, c["D20_N"], c["T_at_target_s"], c["converged"], c["parts"]["car"]["D_N"], c["parts"]["wheelR"]["D_N"])
          EOF
