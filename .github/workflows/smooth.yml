name: smooth

# Does the body change smoothly with its settings? A gradient solver needs it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        mm: ["1.0", "0.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy scipy pandas trimesh scikit-image shapely rtree mapbox-earcut manifold3d fast_simplification jax jaxlib matplotlib
      - working-directory: part5-simulation
        run: python -W ignore checks/smooth_test.py --mm ${{ matrix.mm }}
