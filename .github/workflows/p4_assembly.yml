name: p4_assembly
run-name: "Part 4: ${{ inputs.label }} ${{ inputs.carve == 'true' && 'carved' || 'lofted' }} cars assembled and judged, ${{ inputs.machines }} machines x ${{ inputs.cars_per_machine }} cars, seeds from ${{ inputs.seed_base }}"

# Part 4's car rounds: random bodies (carved or lofted), every part attached, the referee run.
# One machine per seed; max_parallel keeps to Part 4's cap on the account it runs on.
on:
  workflow_dispatch:
    inputs:
      label:
        description: "canary (untagged Part 1 main) or official (Part 1 frozen tag)"
        default: "canary"
      cars_per_machine:
        default: "25"
      carve:
        description: "true = cars carved from the block"
        default: "true"
      seed_base:
        default: "43400"
      machines:
        description: how many machines (seeds), at most 60
        default: "40"
      max_parallel:
        description: Part 4's cap on this account
        default: "15"
      keep_files:
        description: "true = keep each car's built files (stl, json) as artifacts, for tracing"
        default: "false"
      car_limit_s:
        description: seconds one car may take before it is stopped (900 stopped 14 cars on slow runners)
        default: "1800"

permissions:
  contents: read

env:
  PY_DEPS: pytest numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1

jobs:
  seeds:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.s.outputs.list }}
    steps:
      - id: s
        run: echo "list=$(python3 -c "print(list(range(int('${{ inputs.machines }}'))))")" >> "$GITHUB_OUTPUT"
  cars:
    needs: seeds
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        seed: ${{ fromJSON(needs.seeds.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Libraries the remesher needs
        timeout-minutes: 20
        run: (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done) && sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
      - run: pip install $PY_DEPS
      - name: Build random cars
        working-directory: part5-simulation
        env: { CAR_LIMIT_S: "${{ inputs.car_limit_s }}", P4_KEEP_DIR: "${{ inputs.keep_files == 'true' && '../stress/files' || '' }}" }
        run: python -W ignore checks/stress_cars.py --seed $(( ${{ matrix.seed }} + ${{ inputs.seed_base }} )) --n ${{ inputs.cars_per_machine }} --out ../stress ${{ inputs.carve == 'true' && '--carve' || '' }} 2>&1 | grep --line-buffered -E '^car '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-${{ matrix.seed }}
          path: |
            stress/*.json
            stress/files/**
  summary:
    needs: cars
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with: { path: all, pattern: "stress-*" }
      - run: pip install $PY_DEPS
      - name: Summary
        working-directory: part5-simulation
        run: python checks/stress_cars.py --summary ../all 2>&1 | tee ../summary.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: summary, path: summary.txt }
