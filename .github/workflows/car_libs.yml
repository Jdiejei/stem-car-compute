name: car_libs

# Which library version pinches a support file? The same cars, older versions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  car:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        car: ["12 4", "1005 4", "2037 2"]
        libs: ["fast_simplification==0.1.13", "scipy==1.16.0", "numpy==2.3.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 10
        run: (for i in 1 2 3 4; do timeout 240 sudo apt-get update -q && break; done) && sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
      - run: pip install numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1
      - run: pip install ${{ matrix.libs }}
      - working-directory: part5-simulation
        run: |
          set -- ${{ matrix.car }}
          python -W ignore checks/stress_cars.py --seed $1 --only $2 2>&1 | grep --line-buffered -E '^car |Error|Traceback'
