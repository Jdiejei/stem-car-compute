name: p3_car_modes
run-name: "Part 3: measured map on a carved car and its test on random cuts (${{ inputs.label }})"

# Base car (Part 1's start block at a fixed skin), then every mode and random cut timed on the
# base car's reshaped mesh from its flow, then the judge. See part3-simulation/checks/car_modes.py.
on:
  workflow_dispatch:
    inputs:
      label: { required: true }
      nmodes: { default: "60" }
      ncuts: { default: "40" }
      iters: { default: "1000" }
      chunk: { default: "6" }
      parallel: { default: "6" }

permissions: { contents: read }

env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1
  OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
  OMPI_MCA_rmaps_base_oversubscribe: "1"
  P3_NMODES: ${{ inputs.nmodes }}
  P3_NCUTS: ${{ inputs.ncuts }}
  P3_CFD_ITERS: ${{ inputs.iters }}
  P3_CHUNK: ${{ inputs.chunk }}
  INSTALL: |
    (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; sleep 20; done) || echo "apt update did not finish; using the runner's package lists"
    sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
    for i in 1 2 3 4 5; do
      (curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash) && sudo apt-get install -y -q openfoam2412-default && break
      sleep 30
    done
    test -d /usr/lib/openfoam/openfoam2412/tutorials || { echo "OpenFOAM did not install"; exit 1; }

jobs:
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 30
        shell: bash
        run: eval "$INSTALL"; pip install $PY_DEPS
      - id: plan
        working-directory: part5-simulation
        run: echo "plan=$(python ../part3-simulation/checks/car_modes.py plan)" >> "$GITHUB_OUTPUT"
      - shell: bash
        working-directory: part5-simulation
        run: python -W ignore -u ../part3-simulation/checks/car_modes.py run - ../base base 2>&1 | grep --line-buffered -E '^LAB|Traceback|Error|^  File|failed'; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        with: { name: base, path: base }

  cars:
    needs: base
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        items: ${{ fromJSON(needs.base.outputs.plan) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 30
        shell: bash
        run: eval "$INSTALL"; pip install $PY_DEPS
      - uses: actions/download-artifact@v4
        with: { name: base, path: base }
      - shell: bash
        working-directory: part5-simulation
        run: python -W ignore -u ../part3-simulation/checks/car_modes.py run ../base/refmesh ../out ${{ matrix.items }} 2>&1 | grep --line-buffered -E '^LAB|Traceback|Error|^  File|failed'; exit ${PIPESTATUS[0]}
      - if: always()
        run: echo "NAME=cars-$(echo '${{ matrix.items }}' | tr ' +' '_p')" >> "$GITHUB_ENV"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "${{ env.NAME }}", path: out, if-no-files-found: ignore }

  judge:
    needs: cars
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy==2.4.6
      - uses: actions/download-artifact@v4
        with: { path: res }
      - run: rm -rf res/base/refmesh && python -u part3-simulation/checks/car_modes.py judge res
      - uses: actions/upload-artifact@v4
        with: { name: map, path: res/map_dT_dn.npy, if-no-files-found: ignore }
