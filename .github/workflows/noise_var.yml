name: noise_var

# Which mesh settings make drag stop jumping? The same car at skins 0.01 mm apart, with the
# settings given. Drag is also read at earlier iterations: how soon has the solve settled?
on:
  workflow_dispatch:
    inputs:
      label: { required: true }
      res: { default: "medium" }
      iters: { default: "2000" }
      opt: { default: "{}" }

permissions:
  contents: read

env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1

jobs:
  car:
    name: ${{ inputs.label }} ${{ matrix.skin }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        skin: ["3.90", "3.91", "3.92", "3.93", "3.94", "3.95", "3.96", "3.97"]
    env:
      OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 25
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done)
          sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -q openfoam2412-default
      - run: pip install $PY_DEPS
      - working-directory: part5-simulation
        run: |
          python -W ignore run_car.py --out ../out/s${{ matrix.skin }} --body-json '{}' --skin-mm ${{ matrix.skin }} --cfd --cfd-iters ${{ inputs.iters }} --res ${{ inputs.res }} --np 4 --keep-runs --cfd-json '${{ inputs.opt }}' 2>&1 | tail -2
      - name: The numbers
        if: always()
        run: |
          python - <<'EOF'
          import glob, json, re
          import numpy as np
          s = json.load(open("out/s${{ matrix.skin }}/summary.json"))
          c = s["cfd_initial"]
          print("VAR ${{ inputs.label }}", ${{ matrix.skin }}, "D", c["D20_N"], "T", c["T_at_target_s"], "conv", c["converged"], "seconds", c["seconds"], "car", c["parts"]["car"]["D_N"])
          total = None
          for f in glob.glob("part2-simulation/cfd_case_template/runs/*/postProcessing/forces*/*/force*.dat"):
              rows = [[float(v) for v in re.sub(r"[()]", " ", line).split()[:2]] for line in open(f) if not line.startswith("#")]
              a = np.array(rows)
              if len(a) >= 100:
                  total = a[:, 1] if total is None else total + a[:, 1] if len(a) == len(total) else total
          print("VAR ${{ inputs.label }}", ${{ matrix.skin }}, "by iteration", " ".join(f"{end}:{total[int(end * .8):end].mean():.5f}" for end in (250, 500, 750, 1000, 1500, 2000) if end <= len(total)))
          for line in open(glob.glob("part2-simulation/cfd_case_template/runs/*/logs/snappyHexMesh.log")[0]):
              if line.startswith(("car ", "wheelF", "wheelR", "Mesh with layers")):
                  print("VAR ${{ inputs.label }}", ${{ matrix.skin }}, "mesh", line.strip()[:70])
          EOF
