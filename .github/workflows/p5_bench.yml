name: p5_bench
run-name: "Part 5 (loop): fake-stopwatch bench, ${{ inputs.runs }} runs per cell"
on:
  workflow_dispatch:
    inputs:
      runs: { default: "200" }
permissions: { contents: read }
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy==2.4.6
      - run: python -u part5-simulation/checks/bench.py ${{ inputs.runs }}
