name: body_lab

# Why a body's surface is not closed, and what closes it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  car:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        car: ["4024 38", "8009 14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 20
        run: (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done) && sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
      - run: pip install numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1
      - working-directory: part5-simulation
        run: python -W ignore ../.github/lab/body_lab.py ${{ matrix.car }} 2>&1 | grep --line-buffered -E '^LAB|Traceback|Error|^  File'
