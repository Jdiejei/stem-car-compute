name: p2_tests
run-name: "Part 2: built-in checks"

# Part 2's unit tests alone, on one machine (tests.yml runs every part on 8).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: (for i in 1 2 3 4 5 6; do timeout 300 sudo apt-get update -q -o Acquire::Retries=5 && break; sleep 30; done) && sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
      - run: pip install pytest numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1
      - working-directory: part2-simulation
        env:
          PART2_PATH: ${{ github.workspace }}/part2-simulation
        run: python -m pytest tests -q -p no:cacheprovider --tb=short -W ignore 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
