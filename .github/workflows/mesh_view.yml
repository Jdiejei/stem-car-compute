name: mesh_view
run-name: "Mesh pictures: ${{ inputs.car }} on ${{ inputs.res }}"
on:
  workflow_dispatch:
    inputs:
      car:
        default: "C0"
      res:
        default: "medium"
permissions: { contents: read }
jobs:
  mesh:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env: { OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1", OMPI_MCA_rmaps_base_oversubscribe: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 45
        run: |
          ((for i in 1 2 3; do timeout 120 sudo apt-get update -q && break; sleep 20; done) || true)
          for i in 1 2 3 4; do sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0 && break; sleep 60; done
          for i in 1 2 3 4; do (curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash) && sudo apt-get install -y -q openfoam2412-default && break; sleep 60; done
      - run: pip install numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1 meshio
      - working-directory: part5-simulation
        run: |
          python -W ignore ../part2-simulation/rank_study.py car ${{ inputs.car }} --res ${{ inputs.res }} --np 1 --iters 3 --cfd-json '{"keep_run_dir": true}' --out ../out/car 2>&1 | tail -8 || true
      - name: Cells, quality and pictures
        run: |
          find / -path '*polyMesh/owner' -not -path '/proc/*' 2>/dev/null | grep -v -E 'tutorials|/usr/lib/openfoam' | head -5
          O=$(find / -path '*constant/polyMesh/owner' -not -path '/proc/*' 2>/dev/null | grep -v -E 'tutorials|/usr/lib/openfoam|processor' | head -1)
          D=$(dirname $(dirname $(dirname "$O")))
          echo "case: $D"
          source /usr/lib/openfoam/openfoam2412/etc/bashrc || true
          cd "$D"; checkMesh -latestTime 2>&1 | grep -E "cells:|faces:|Max non-orth|Max skewness|Mesh OK|Failed" | tee -a $GITHUB_STEP_SUMMARY
          grep -A3 -E "^ *car$" constant/polyMesh/boundary | head -4 | tee -a $GITHUB_STEP_SUMMARY
          foamToVTK -latestTime -noInternal -patches '(symmetry car)' > /dev/null 2>&1 || foamToVTK -noInternal > /dev/null
          cd - ; python .github/lab/mesh_view.py "$D/VTK" "${{ inputs.res }}" pics
      - uses: actions/upload-artifact@v4
        with:
          name: "mesh-${{ inputs.car }}-${{ inputs.res }}"
          path: pics
