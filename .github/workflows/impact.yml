name: impact

# What would more freedom be worth in race time? Each variation at three skins, to average the
# mesh noise, against the same car at the same skins. And how far today's settings reach.
on:
  workflow_dispatch:
    inputs:
      variants:
        description: JSON list of variations (empty = the first sweep, plus the adjoint map)
        default: ""

permissions:
  contents: read

env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1
  OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
  OMPI_MCA_rmaps_base_oversubscribe: "1"

jobs:
  map:
    if: inputs.variants == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 25
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done)
          sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -q openfoam2412-default
      - run: pip install $PY_DEPS
      - working-directory: part5-simulation
        run: python -W ignore ../.github/lab/impact_lab.py map 2>&1 | grep --line-buffered -E '^IMP|Traceback|Error|^  File'
  sweep:
    name: ${{ matrix.v }} ${{ matrix.skin }}
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        v: ${{ fromJSON(inputs.variants || '["base", "fw_endplate8", "fw_endplate15", "fw_chord18", "fw_chord22", "fw_flapgap1", "fw_noflap", "rw_aoa-4", "rw_aoa4", "rw_camber4", "rw_chord20", "rw_span30", "rw_span35", "rw_x10", "rw_x20", "rw_pylon6", "rw_pylon15", "rw_high3", "sup_nodiscF", "sup_nodiscR", "sup_disc9", "sup_pod10", "sup_arch16", "sup_arch22", "nose_blend5", "wheel_round1", "wheel_round2", "wheel_round3"]') }}
        skin: ["3.92", "3.93", "3.94"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 25
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done)
          sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -q openfoam2412-default
      - run: pip install $PY_DEPS
      - working-directory: part5-simulation
        run: python -W ignore ../.github/lab/impact_lab.py sweep ${{ matrix.v }} ${{ matrix.skin }} 2>&1 | grep --line-buffered -E '^IMP|Traceback|Error|^  File'
