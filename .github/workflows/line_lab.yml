name: line_lab

# Does the adjoint point downhill? The start car moved along it, both ways, at a fixed skin,
# on the no-layer mesh. Drag should fall one way and rise the other.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1
  OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
  OMPI_MCA_rmaps_base_oversubscribe: "1"

jobs:
  slopes:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 25
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done)
          sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -q openfoam2412-default
      - run: pip install $PY_DEPS
      - working-directory: part5-simulation
        run: python -W ignore ../.github/lab/line_lab.py slopes ../slopes.json 2>&1 | grep --line-buffered -E '^LINE|Traceback|Error|^  File'
      - uses: actions/upload-artifact@v4
        with:
          name: slopes
          path: slopes.json
  step:
    needs: slopes
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        move: ["0", "0.25", "0.5", "1", "2", "-0.25", "-0.5", "-1", "-2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 25
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done)
          sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -q openfoam2412-default
      - run: pip install $PY_DEPS
      - uses: actions/download-artifact@v4
        with: { name: slopes }
      - working-directory: part5-simulation
        run: python -W ignore ../.github/lab/line_lab.py step ../slopes.json ${{ matrix.move }} 2>&1 | grep --line-buffered -E '^LINE|Traceback|Error'
