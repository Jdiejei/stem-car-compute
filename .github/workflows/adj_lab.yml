name: adj_lab

# Why the adjoint does not predict drag: its slopes weighted several ways, with and without
# layers, against CFD. And the same settings measured directly on the no-layer mesh.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1
  OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
  OMPI_MCA_rmaps_base_oversubscribe: "1"

jobs:
  adjoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        mesh: [layers, nolayers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 25
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done)
          sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -q openfoam2412-default
      - run: pip install $PY_DEPS
      - working-directory: part5-simulation
        run: python -W ignore ../.github/lab/adj_lab.py ${{ matrix.mesh }} 2>&1 | grep --line-buffered -E '^LAB|Traceback|Error|^  File'
  direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        setting: [st_zt3, mode47, mode5, mode41, st_b4, mode25, s_b, mode6, st_zb1, mode3, st_b0, p, st_zb5, mode2, mode1, st_zb0, st_b1, mode26]
        sign: ["1", "-1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 25
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done)
          sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -q openfoam2412-default
      - run: pip install $PY_DEPS
      - working-directory: part5-simulation
        run: |
          python -W ignore ../.github/lab/dir_lab.py ${{ matrix.setting }} ${{ matrix.sign }} '{"layer_overrides":{"nSurfaceLayers":0}}' 2>&1 | grep --line-buffered -E '^DIR|Traceback|Error'
