name: repeat

# The same car, built and solved on six machines exactly as the solver does. Are the built
# files identical, and how far apart are the race times? Which CPU each machine had.
on:
  workflow_dispatch:
    inputs:
      skin: { default: "3.93" }

permissions:
  contents: read

env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1
  OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
  OMPI_MCA_rmaps_base_oversubscribe: "1"

jobs:
  car:
    name: rep ${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 25
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done)
          sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -q openfoam2412-default
      - run: pip install $PY_DEPS
      - working-directory: part5-simulation
        run: python -W ignore run_car.py --out ../out/r --body-json '{}' --skin-mm ${{ inputs.skin }} --cfd --res medium --np 4 --cfd-iters 1000 --cfd-json '{"layer_overrides":{"nSurfaceLayers":0}}' 2>&1 | tail -2
      - name: The numbers
        if: always()
        run: |
          echo "REP cpu $(lscpu | grep 'Model name' | sed 's/.*: *//') nproc $(nproc)"
          echo "REP body $(sha256sum out/r/body_half.stl | cut -c1-16)"
          for f in out/r/manufacture/*.stl; do echo "REP file $(basename $f) $(sha256sum $f | cut -c1-16)"; done
          echo "REP cells $(grep -rh 'cells:' out/r --include='log.checkMesh*' 2>/dev/null | head -1)"
          python - <<'PY'
          import json
          c = json.load(open("out/r/summary.json"))["cfd_initial"]
          print("REP result D20", round(c["D20_N"], 6), "T", round(c["T_at_target_s"], 6), "converged", c["converged"],
                "stderr", c.get("stderr"), "drift", c.get("drift"))
          PY
